# SPDX-License-Identifier: EUPL-1.2
#
# Code scanning: CodeQL analyses the Python, workflow and Rust code of
# this repository and uploads findings to the forge's code scanning. The
# job is no part of the verification gate and no required check; it runs
# on main, once a week, and by hand. It does not run on pull requests:
# uploading findings needs security-events: write, which no job a pull
# request starts may hold.
# Copied from the Praetor engine's codeql.yml with its Go steps removed.
name: Code scanning

'on':
  push:
    branches: ['main']
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  # One run scans at a time and at most one waits. A newer push or
  # scheduled run replaces the waiting one, so a burst of pushes scans the
  # first and the newest commit; code scanning keeps the newest analysis.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # Only the main branch's own workflow uploads findings: a manual run
    # started from another branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # the findings go to the forge's code scanning
    strategy:
      fail-fast: false
      max-parallel: 2  # at most two analyses at once
      matrix:
        # CodeQL reads all three without a build. For Rust it runs
        # rust-analyzer on the Cargo workspace, and the runner's rustup
        # installs the toolchain rust-toolchain.toml pins.
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout Source Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
