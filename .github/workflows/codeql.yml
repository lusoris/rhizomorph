#
# Code scanning: CodeQL analyses the Python and workflow code of this
# repository and uploads findings to the forge's code scanning. The job is no
# part of the verification gate and no required check; it runs on main, once
# a week, and by hand. It does not run on pull requests: uploading findings
# needs security-events: write, which no job a pull request starts may hold.
# Copied from the Praetor engine's codeql.yml with its Go steps removed.
name: Code scanning

'on':
  push:
    branches: ['main']
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  # Each push and scheduled run gets its own group and is never cancelled,
  # so every main commit gets its verdict.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # the findings go to the forge's code scanning
    strategy:
      fail-fast: false
      matrix:
        # CodeQL reads Python and workflows without a build. A language with
        # no source files fails the analysis, so Rust joins with the crates.
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout Source Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        # yamllint disable-line rule:line-length
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
