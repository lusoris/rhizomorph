---
# SPDX-FileCopyrightText: 2026 Lusoris <lusoris@pm.me>
# SPDX-License-Identifier: EUPL-1.2
#
# Rust workspace gate: runs workspace unit and integration tests, the
# thumbv7em-none-eabihf no_std build of kernel, clippy lints, rustfmt check,
# cargo-deny dependency licence verification (with planted negative check),
# and cargo-mutants kernel mutation testing (with planted negative check).
name: Rust

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every cargo build and test treats a compiler warning as an error (HISS-10).
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run workspace tests
        if: github.event.pull_request.draft != true
        run: cargo test --workspace --locked

  no_std_build:
    name: no_std build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build kernel for thumbv7em-none-eabihf
        if: github.event.pull_request.draft != true
        run: cargo build -p kernel --target thumbv7em-none-eabihf --locked

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run clippy
        if: github.event.pull_request.draft != true
        run: >-
          cargo clippy --workspace --all-targets --locked --
          -D warnings -D clippy::unwrap_used -D clippy::expect_used

  fmt:
    name: fmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        if: github.event.pull_request.draft != true
        run: cargo fmt --all --check

  licences:
    name: licences
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-deny@0.21.0
      - name: Verify dependency licences
        if: github.event.pull_request.draft != true
        run: sh scripts/deny-check.sh

  mutants:
    name: mutants
    # Linux only: kernel is no_std and holds no cfg(target_os), cfg(windows),
    # cfg(unix), or cfg(target_family), so which mutants the tests catch does
    # not depend on the host OS.
    runs-on: ubuntu-26.04
    # Legs 900 s + 600 s, each plus up to 70 s stop time
    # (scripts/mutants-check.py), = 1640 s; 30 min leaves room for setup steps.
    timeout-minutes: 30
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-mutants
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-mutants@27.1.0
      - name: Run kernel mutation tests and replay the excluded mutants
        if: github.event.pull_request.draft != true
        run: python3 scripts/mutants-check.py
