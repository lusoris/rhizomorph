---
# SPDX-FileCopyrightText: 2026 Lusoris <lusoris@pm.me>
# SPDX-License-Identifier: EUPL-1.2
#
# Rust workspace gate: runs workspace unit and integration tests, the
# thumbv7em-none-eabihf no_std build of kernel, clippy lints, rustfmt check,
# cargo-deny dependency licence verification (with planted negative check),
# and cargo-mutants kernel and kernel-std mutation testing (with planted
# negative check).
name: Rust

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every cargo build and test treats a compiler warning as an error (HISS-10).
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run workspace tests
        if: github.event.pull_request.draft != true
        run: cargo test --workspace --locked
      - name: Replay the mutation gate checks
        if: github.event.pull_request.draft != true
        timeout-minutes: 2
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v

  no_std_build:
    name: no_std build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build kernel for thumbv7em-none-eabihf
        if: github.event.pull_request.draft != true
        run: cargo build -p kernel --target thumbv7em-none-eabihf --locked

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run clippy
        if: github.event.pull_request.draft != true
        run: >-
          cargo clippy --workspace --all-targets --locked --
          -D warnings -D clippy::unwrap_used -D clippy::expect_used

  fmt:
    name: fmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        if: github.event.pull_request.draft != true
        run: cargo fmt --all --check

  licences:
    name: licences
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c  # v2.90.8
        with:
          tool: cargo-deny@0.21.0
      - name: Verify dependency licences
        if: github.event.pull_request.draft != true
        run: sh scripts/deny-check.sh

  mutants:
    name: mutants
    # kernel is no_std and has no cfg(target_os). The kernel-std tests have
    # Linux-only /proc checks, so Linux runs the strictest variant. The test
    # runner cap needs prlimit from util-linux on the Ubuntu runner.
    runs-on: ubuntu-26.04
    # Legs 900 s + 600 s, each plus up to 82 s stop and cleanup time
    # (scripts/mutants-check.py), = 1664 s; 30 min leaves room for setup steps.
    timeout-minutes: 30
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-mutants
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c  # v2.90.8
        with:
          tool: cargo-mutants@27.1.0
      # yamllint disable-line rule:line-length
      - name: Run kernel and kernel-std mutation tests and replay the excluded mutants
        if: github.event.pull_request.draft != true
        # Process deadline for the script, its file and /proc reads included:
        # 28 min covers both legs plus 82 s per leg end (1664 s) and stays
        # below the 30 min job limit.
        timeout-minutes: 28
        run: python3 scripts/mutants-check.py
