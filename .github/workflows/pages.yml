---
# SPDX-FileCopyrightText: 2026 Lusoris <lusoris@pm.me>
# SPDX-License-Identifier: EUPL-1.2
#
# Build the MkDocs site under --strict on pull requests and pushes to main,
# and deploy it to GitHub Pages from main.
name: Docs

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the revision-date plugin dates each page by its last
          # commit, and a shallow clone would date every page at the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the documentation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r docs/requirements.txt
      - name: Test the link hook
        run: |
          "$RUNNER_TEMP/docs/bin/python" -I -B docs/hooks/test_repo_links.py .
      - name: Configure Pages
        id: pages
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Build documentation
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          "$RUNNER_TEMP/docs/bin/mkdocs" build --strict
      - name: Upload Pages artifact
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Docs deploy
    needs: build
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Queue every waiting deploy: without a queue, a later-arriving older run
    # cancels the pending newer one, then skips at the head check.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      # Prevent a late older build or a rerun of an old run from deploying.
      - name: Check that this run is the main head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          head_sha=$(timeout 60 gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head_sha" = "$RUN_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::$RUN_SHA is not the main head" \
              "$head_sha; the run for the newer commit deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
