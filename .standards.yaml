---
version: 1
repository:
  owner: lusoris
  name: rhizomorph
  visibility: public
  description: "Local-first smart-home and building-automation engine: Rust core, SvelteKit interface."
  homepage: ""
  topics:
    - smart-home
    - building-automation
    - home-automation
    - local-first
    - rust
    - sveltekit
profiles:
  - app-service
facets:
  - security:high
  - agent:sandboxed
overrides:
  branch_protection:
    # One maintainer and no review bot can approve, so no approval is
    # required. Restore independent review when a second maintainer or an
    # approving review bot exists.
    review_mode: single_maintainer
register:
  sources:
    expected: 13
    sha256:
      sha256:dc89789a2103d3b2ad26dedbd66ca013d08f1f4b9859f7764e0910f8e1b20d10
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
release:
  # Binds the release test levels the app-service profile requires to the
  # tests that run them. The `test` job in .github/workflows/rust.yml runs
  # `cargo test --workspace --locked`, which builds and runs both the in-crate
  # unit tests and the Cargo integration tests under crates/*/tests/.
  test_levels:
    unit:
      # In-crate `#[cfg(test)]` modules next to the code they test; the
      # pattern needs a test function (`#[test]`, `#[tokio::test]`, ...)
      # after the module attribute, so an empty test module does not count.
      paths:
        - "crates/*/src/**/*.rs"
      pattern: '(?ms)^\s*#\[cfg\(test\)\].*^\s*#\[(?:\w+::)*test\b[^\]]*\]'
      job: "test"
      run: "cargo test --workspace --locked"
    integration:
      # Cargo integration tests: kernel's public API from outside the crate
      # (positive, negative, boundary) and the kernel-std adapter driving the
      # kernel across the crate boundary and across threads.
      paths:
        - "crates/*/tests/*.rs"
      pattern: '(?m)^\s*#\[(?:\w+::)*test\b[^\]]*\]'
      job: "test"
      run: "cargo test --workspace --locked"
    # No test covers the three levels below yet; each gap is tracked by its
    # own issue. Each level names a dedicated job and a test marker, so a
    # file under these paths closes the gap only when a job of that name
    # runs it: without `job`, the gate's default runner keywords would let
    # the `test` job above (`cargo test`) cover e2e, although Cargo never
    # builds a root-level tests/ directory. Add `run` with the job's command
    # when the job lands.
    e2e:
      # Gap: issue 41 (daemon API flow, after P4 and P5).
      paths:
        - "tests/e2e/**"
      pattern: '(?m)^\s*#\[(?:\w+::)*test\b[^\]]*\]|\btest\('
      job: "e2e"
    load_soak:
      # Gap: issue 42 (sustained telemetry ingress with asserted bounds).
      paths:
        - "tests/load/**"
        - "tests/soak/**"
      pattern: '(?m)^\s*#\[(?:\w+::)*test\b[^\]]*\]'
      job: "load-soak"
    recovery_restore:
      # Gap: issue 43 (daemon restart and crash recovery, after P4).
      paths:
        - "tests/recovery/**"
        - "tests/restore/**"
      pattern: '(?m)^\s*#\[(?:\w+::)*test\b[^\]]*\]'
      job: "recovery-restore"
exceptions:
  - rule: HISS-11
    path: .github/workflows/release.yml
    reason: adoption found the release workflows short of the declared supply chain (SLSA Build Level 3 declared, Level 0 measured; enforce_cosign without a cosign signing step; require_sbom without an SBOM step); raise them as docs/guides/releasing.md in Praetor describes, then remove this entry
    expires: "2027-02-16"
    category: D
  - rule: declared-linters
    tool: gitleaks
    reason: adoption scaffolds no CI job for gitleaks declared by profile "app-service", facet "security:high"; run it in a workflow, or remove this entry
    expires: "2027-02-16"
    category: D
  - rule: declared-linters
    tool: semgrep
    reason: adoption scaffolds no CI job for semgrep declared by profile "app-service", facet "agent:sandboxed"; run it in a workflow, or remove this entry
    expires: "2027-02-16"
    category: D
  - rule: declared-linters
    tool: trivy
    reason: adoption scaffolds no CI job for trivy declared by facet "security:high"; run it in a workflow, or remove this entry
    expires: "2027-02-16"
    category: D
